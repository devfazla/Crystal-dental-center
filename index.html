    <script>
      // GitHub Pages SPA fallback for BrowserRouter.
      // A hard refresh on a deep route (e.g. /gallery) 404s on Pages, which
      // serves 404.html; that file stashes the requested path and bounces to
      // '/'. Here we restore the original path BEFORE React Router boots, so
      // the app renders the right route and the URL stays clean.
      (function () {
        try {
          var redirect = sessionStorage.getItem('spaRedirect');
          if (
            redirect &&
            redirect.charAt(0) === '/' &&
            window.location.pathname === '/'
          ) {
            sessionStorage.removeItem('spaRedirect');
            window.history.replaceState({}, '', redirect);
          }
        } catch (e) {}
      })();
    </script>

            get: function () {
              return _fn;
            },
            set: function (newFn) {
              _fn = newFn;
            },
            configurable: true,
            enumerable: true,
          };
          try {
            Object.defineProperty(window, 'fetch', desc);
          } catch (e) {}
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', desc);
            } catch (e) {}
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', desc);
            } catch (e) {}
          }
        } catch (err) {}
      })();
